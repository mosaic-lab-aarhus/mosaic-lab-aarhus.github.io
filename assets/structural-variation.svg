<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="sv-title sv-desc" font-family="Arial, Helvetica, sans-serif"><title id="sv-title">How structural variants change a DNA sequence</title><desc id="sv-desc">A reference sequence contains blocks A, B, C, D, E, all pointing right. Deletion removes C. Tandem duplication produces A, B, C, C, D, E. Inversion reverses the orientation of C. Insertion adds a new block X between B and C. These are illustrative sequence blocks, not genomic data or a size scale.</desc><defs><pattern id="new-sequence" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="7" height="7" fill="#eef8f0" /><line x1="0" y1="0" x2="0" y2="7" stroke="#a4cfb3" stroke-width="2" /></pattern></defs><rect width="960" height="360" rx="12" fill="#f3f9f5" /><text x="36" y="44" font-size="16" fill="#214d34" font-weight="600">reference sequence</text><g data-variant="reference"><path d="M200 38.0 H522" fill="none" stroke="#a8c7b3" stroke-width="1.4" /><polygon points="207,24 251,24 259,38.0 251,52 207,52" fill="#d9ecdf" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="A" data-orientation="1" /><text x="231.0" y="43.0" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">A</text><polygon points="271,24 315,24 323,38.0 315,52 271,52" fill="#b7dac4" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="B" data-orientation="1" /><text x="295.0" y="43.0" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">B</text><polygon points="335,24 379,24 387,38.0 379,52 335,52" fill="#25764b" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="C" data-orientation="1" /><text x="359.0" y="43.0" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">C</text><polygon points="399,24 443,24 451,38.0 443,52 399,52" fill="#c8e3d2" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="D" data-orientation="1" /><text x="423.0" y="43.0" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">D</text><polygon points="463,24 507,24 515,38.0 507,52 463,52" fill="#a6d0b5" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="E" data-orientation="1" /><text x="487.0" y="43.0" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">E</text></g><text x="610" y="43" font-size="14" fill="#4f715b" font-weight="400">Same blocks, altered structure.</text><path d="M24 73 H936" stroke="#d4e5d9" stroke-width="1" /><g data-variant="deletion"><rect x="24" y="90" width="445" height="110" rx="9" fill="#ffffff" stroke="#d9e8de" stroke-width="1" /><text x="40" y="114" font-size="16" fill="#214d34" font-weight="600">deletion</text><path d="M33 145.5 H291" fill="none" stroke="#a8c7b3" stroke-width="1.4" /><polygon points="40,132 84,132 92,145.5 84,159 40,159" fill="#d9ecdf" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="A" data-orientation="1" /><text x="64.0" y="150.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">A</text><polygon points="104,132 148,132 156,145.5 148,159 104,159" fill="#b7dac4" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="B" data-orientation="1" /><text x="128.0" y="150.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">B</text><polygon points="168,132 212,132 220,145.5 212,159 168,159" fill="#c8e3d2" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="D" data-orientation="1" /><text x="192.0" y="150.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">D</text><polygon points="232,132 276,132 284,145.5 276,159 232,159" fill="#a6d0b5" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="E" data-orientation="1" /><text x="256.0" y="150.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">E</text><text x="40" y="184" font-size="13.5" fill="#4f715b" font-weight="400">C is removed.</text></g><g data-variant="duplication"><rect x="491" y="90" width="445" height="110" rx="9" fill="#ffffff" stroke="#d9e8de" stroke-width="1" /><text x="507" y="114" font-size="16" fill="#214d34" font-weight="600">duplication</text><path d="M500 145.5 H886" fill="none" stroke="#a8c7b3" stroke-width="1.4" /><polygon points="507,132 551,132 559,145.5 551,159 507,159" fill="#d9ecdf" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="A" data-orientation="1" /><text x="531.0" y="150.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">A</text><polygon points="571,132 615,132 623,145.5 615,159 571,159" fill="#b7dac4" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="B" data-orientation="1" /><text x="595.0" y="150.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">B</text><polygon points="635,132 679,132 687,145.5 679,159 635,159" fill="#25764b" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="C" data-orientation="1" /><text x="659.0" y="150.5" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">C</text><polygon points="699,132 743,132 751,145.5 743,159 699,159" fill="#25764b" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="C" data-orientation="1" /><text x="723.0" y="150.5" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">C</text><polygon points="763,132 807,132 815,145.5 807,159 763,159" fill="#c8e3d2" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="D" data-orientation="1" /><text x="787.0" y="150.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">D</text><polygon points="827,132 871,132 879,145.5 871,159 827,159" fill="#a6d0b5" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="E" data-orientation="1" /><text x="851.0" y="150.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">E</text><text x="507" y="184" font-size="13.5" fill="#4f715b" font-weight="400">An extra copy of C.</text></g><g data-variant="inversion"><rect x="24" y="212" width="445" height="110" rx="9" fill="#ffffff" stroke="#d9e8de" stroke-width="1" /><text x="40" y="236" font-size="16" fill="#214d34" font-weight="600">inversion</text><path d="M33 267.5 H355" fill="none" stroke="#a8c7b3" stroke-width="1.4" /><polygon points="40,254 84,254 92,267.5 84,281 40,281" fill="#d9ecdf" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="A" data-orientation="1" /><text x="64.0" y="272.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">A</text><polygon points="104,254 148,254 156,267.5 148,281 104,281" fill="#b7dac4" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="B" data-orientation="1" /><text x="128.0" y="272.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">B</text><polygon points="220,254 176,254 168,267.5 176,281 220,281" fill="#25764b" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="C" data-orientation="-1" /><text x="196.0" y="272.5" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">C</text><polygon points="232,254 276,254 284,267.5 276,281 232,281" fill="#c8e3d2" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="D" data-orientation="1" /><text x="256.0" y="272.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">D</text><polygon points="296,254 340,254 348,267.5 340,281 296,281" fill="#a6d0b5" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="E" data-orientation="1" /><text x="320.0" y="272.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">E</text><text x="40" y="306" font-size="13.5" fill="#4f715b" font-weight="400">C has the opposite orientation.</text></g><g data-variant="insertion"><rect x="491" y="212" width="445" height="110" rx="9" fill="#ffffff" stroke="#d9e8de" stroke-width="1" /><text x="507" y="236" font-size="16" fill="#214d34" font-weight="600">insertion</text><path d="M500 267.5 H886" fill="none" stroke="#a8c7b3" stroke-width="1.4" /><polygon points="507,254 551,254 559,267.5 551,281 507,281" fill="#d9ecdf" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="A" data-orientation="1" /><text x="531.0" y="272.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">A</text><polygon points="571,254 615,254 623,267.5 615,281 571,281" fill="#b7dac4" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="B" data-orientation="1" /><text x="595.0" y="272.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">B</text><polygon points="635,254 679,254 687,267.5 679,281 635,281" fill="url(#new-sequence)" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="X" data-orientation="1" /><text x="659.0" y="272.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">X</text><polygon points="699,254 743,254 751,267.5 743,281 699,281" fill="#25764b" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="C" data-orientation="1" /><text x="723.0" y="272.5" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">C</text><polygon points="763,254 807,254 815,267.5 807,281 763,281" fill="#c8e3d2" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="D" data-orientation="1" /><text x="787.0" y="272.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">D</text><polygon points="827,254 871,254 879,267.5 871,281 827,281" fill="#a6d0b5" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="E" data-orientation="1" /><text x="851.0" y="272.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">E</text><text x="507" y="306" font-size="13.5" fill="#4f715b" font-weight="400">A new segment, X, is added.</text></g><text x="36" y="344" font-size="12" fill="#4f715b" font-weight="400">Illustrative blocks; not to scale. Arrowheads indicate sequence orientation.</text></svg>
