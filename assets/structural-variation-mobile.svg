<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640" role="img" aria-labelledby="sv-title sv-desc" font-family="Arial, Helvetica, sans-serif"><title id="sv-title">How structural variants change a DNA sequence</title><desc id="sv-desc">A reference sequence contains blocks A, B, C, D, E, all pointing right. Deletion removes C. Tandem duplication produces A, B, C, C, D, E. Inversion reverses the orientation of C. Insertion adds a new block X between B and C. These are illustrative sequence blocks, not genomic data or a size scale.</desc><defs><pattern id="new-sequence" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="7" height="7" fill="#eef8f0" /><line x1="0" y1="0" x2="0" y2="7" stroke="#a4cfb3" stroke-width="2" /></pattern></defs><rect width="360" height="640" rx="12" fill="#f3f9f5" /><text x="20" y="27" font-size="15" fill="#214d34" font-weight="600">reference sequence</text><g data-variant="reference"><path d="M45 57.0 H317" fill="none" stroke="#a8c7b3" stroke-width="1.4" /><polygon points="52,43 86,43 94,57.0 86,71 52,71" fill="#d9ecdf" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="A" data-orientation="1" /><text x="71.0" y="62.0" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">A</text><polygon points="106,43 140,43 148,57.0 140,71 106,71" fill="#b7dac4" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="B" data-orientation="1" /><text x="125.0" y="62.0" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">B</text><polygon points="160,43 194,43 202,57.0 194,71 160,71" fill="#25764b" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="C" data-orientation="1" /><text x="179.0" y="62.0" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">C</text><polygon points="214,43 248,43 256,57.0 248,71 214,71" fill="#c8e3d2" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="D" data-orientation="1" /><text x="233.0" y="62.0" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">D</text><polygon points="268,43 302,43 310,57.0 302,71 268,71" fill="#a6d0b5" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="E" data-orientation="1" /><text x="287.0" y="62.0" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">E</text></g><path d="M20 91 H340" stroke="#d4e5d9" stroke-width="1" /><g data-variant="deletion"><rect x="18" y="106" width="324" height="109" rx="9" fill="#ffffff" stroke="#d9e8de" stroke-width="1" /><text x="34" y="130" font-size="16" fill="#214d34" font-weight="600">deletion</text><path d="M27 161.5 H225" fill="none" stroke="#a8c7b3" stroke-width="1.4" /><polygon points="34,148 66,148 74,161.5 66,175 34,175" fill="#d9ecdf" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="A" data-orientation="1" /><text x="52.0" y="166.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">A</text><polygon points="82,148 114,148 122,161.5 114,175 82,175" fill="#b7dac4" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="B" data-orientation="1" /><text x="100.0" y="166.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">B</text><polygon points="130,148 162,148 170,161.5 162,175 130,175" fill="#c8e3d2" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="D" data-orientation="1" /><text x="148.0" y="166.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">D</text><polygon points="178,148 210,148 218,161.5 210,175 178,175" fill="#a6d0b5" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="E" data-orientation="1" /><text x="196.0" y="166.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">E</text><text x="34" y="200" font-size="12.5" fill="#4f715b" font-weight="400">C is removed.</text></g><g data-variant="duplication"><rect x="18" y="227" width="324" height="109" rx="9" fill="#ffffff" stroke="#d9e8de" stroke-width="1" /><text x="34" y="251" font-size="16" fill="#214d34" font-weight="600">duplication</text><path d="M27 282.5 H321" fill="none" stroke="#a8c7b3" stroke-width="1.4" /><polygon points="34,269 66,269 74,282.5 66,296 34,296" fill="#d9ecdf" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="A" data-orientation="1" /><text x="52.0" y="287.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">A</text><polygon points="82,269 114,269 122,282.5 114,296 82,296" fill="#b7dac4" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="B" data-orientation="1" /><text x="100.0" y="287.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">B</text><polygon points="130,269 162,269 170,282.5 162,296 130,296" fill="#25764b" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="C" data-orientation="1" /><text x="148.0" y="287.5" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">C</text><polygon points="178,269 210,269 218,282.5 210,296 178,296" fill="#25764b" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="C" data-orientation="1" /><text x="196.0" y="287.5" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">C</text><polygon points="226,269 258,269 266,282.5 258,296 226,296" fill="#c8e3d2" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="D" data-orientation="1" /><text x="244.0" y="287.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">D</text><polygon points="274,269 306,269 314,282.5 306,296 274,296" fill="#a6d0b5" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="E" data-orientation="1" /><text x="292.0" y="287.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">E</text><text x="34" y="321" font-size="12.5" fill="#4f715b" font-weight="400">An extra copy of C.</text></g><g data-variant="inversion"><rect x="18" y="348" width="324" height="109" rx="9" fill="#ffffff" stroke="#d9e8de" stroke-width="1" /><text x="34" y="372" font-size="16" fill="#214d34" font-weight="600">inversion</text><path d="M27 403.5 H273" fill="none" stroke="#a8c7b3" stroke-width="1.4" /><polygon points="34,390 66,390 74,403.5 66,417 34,417" fill="#d9ecdf" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="A" data-orientation="1" /><text x="52.0" y="408.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">A</text><polygon points="82,390 114,390 122,403.5 114,417 82,417" fill="#b7dac4" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="B" data-orientation="1" /><text x="100.0" y="408.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">B</text><polygon points="170,390 138,390 130,403.5 138,417 170,417" fill="#25764b" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="C" data-orientation="-1" /><text x="152.0" y="408.5" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">C</text><polygon points="178,390 210,390 218,403.5 210,417 178,417" fill="#c8e3d2" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="D" data-orientation="1" /><text x="196.0" y="408.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">D</text><polygon points="226,390 258,390 266,403.5 258,417 226,417" fill="#a6d0b5" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="E" data-orientation="1" /><text x="244.0" y="408.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">E</text><text x="34" y="442" font-size="12.5" fill="#4f715b" font-weight="400">C has the opposite orientation.</text></g><g data-variant="insertion"><rect x="18" y="469" width="324" height="109" rx="9" fill="#ffffff" stroke="#d9e8de" stroke-width="1" /><text x="34" y="493" font-size="16" fill="#214d34" font-weight="600">insertion</text><path d="M27 524.5 H321" fill="none" stroke="#a8c7b3" stroke-width="1.4" /><polygon points="34,511 66,511 74,524.5 66,538 34,538" fill="#d9ecdf" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="A" data-orientation="1" /><text x="52.0" y="529.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">A</text><polygon points="82,511 114,511 122,524.5 114,538 82,538" fill="#b7dac4" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="B" data-orientation="1" /><text x="100.0" y="529.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">B</text><polygon points="130,511 162,511 170,524.5 162,538 130,538" fill="url(#new-sequence)" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="X" data-orientation="1" /><text x="148.0" y="529.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">X</text><polygon points="178,511 210,511 218,524.5 210,538 178,538" fill="#25764b" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="C" data-orientation="1" /><text x="196.0" y="529.5" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">C</text><polygon points="226,511 258,511 266,524.5 258,538 226,538" fill="#c8e3d2" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="D" data-orientation="1" /><text x="244.0" y="529.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">D</text><polygon points="274,511 306,511 314,524.5 306,538 274,538" fill="#a6d0b5" stroke="#4a8962" stroke-width=".8" stroke-linejoin="round" data-block="E" data-orientation="1" /><text x="292.0" y="529.5" font-size="14" fill="#214d34" font-weight="600" text-anchor="middle">E</text><text x="34" y="563" font-size="12.5" fill="#4f715b" font-weight="400">A new segment, X, is added.</text></g><text x="20" y="611" font-size="11" fill="#4f715b" font-weight="400">Illustrative blocks; not to scale.</text><text x="20" y="628" font-size="11" fill="#4f715b" font-weight="400">Arrowheads indicate sequence orientation.</text></svg>
